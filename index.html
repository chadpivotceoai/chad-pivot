<style>
  :root { --bg:#ffffff; --bg2:#f5f5f7; --card:#f5f5f7; --line:#d2d2d7; --text:#1d1d1f; --muted:#6e6e73; --red:#d12a0d; --gold:#a85a00; --nav:rgba(255,255,255,.8); }
  html[data-theme="dark"] { --bg:#000; --bg2:#0b0d12; --card:#14171f; --line:#262b38; --text:#f2f3f6; --muted:#9aa3b2; --red:#e53012; --gold:#ffb300; --nav:rgba(0,0,0,.75); }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height:1.5; }
  a { color:inherit; }
  .banner { background:#ffb300; color:#000; text-align:center; padding:8px 12px; font-size:.85rem; font-weight:600; position:sticky; top:0; z-index:20; }
  nav { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 24px; position:sticky; top:35px; z-index:10; background:var(--nav); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav .logo { font-weight:700; }
  nav .links { display:flex; gap:20px; font-size:.9rem; color:var(--muted); flex-wrap:wrap; }
  nav .links a { text-decoration:none; } nav .links a:hover { color:var(--text); }
  .right { display:flex; gap:10px; align-items:center; }
  .lang button { background:none; border:1px solid var(--line); color:var(--muted); padding:4px 10px; border-radius:14px; cursor:pointer; }
  .lang button.on { color:var(--text); border-color:var(--red); }
  .theme { background:none; border:1px solid var(--line); color:var(--text); width:34px; height:30px; border-radius:15px; cursor:pointer; font-size:1rem; }
  .btn { display:inline-block; padding:12px 24px; border-radius:30px; text-decoration:none; font-weight:600; border:1px solid transparent; cursor:pointer; }
  .btn.red { background:var(--red); color:#fff; } .btn.red:hover { filter:brightness(1.15); }
  .btn.ghost { border-color:var(--muted); color:var(--text); } .btn.ghost:hover { border-color:var(--text); }
  .btn.small { padding:7px 16px; font-size:.85rem; }
  section { padding:96px 24px; max-width:1000px; margin:0 auto; text-align:center; }
  .hero { padding-top:64px; }
  .eyebrow { color:var(--gold); font-weight:600; letter-spacing:.04em; }
  h1 { font-size:clamp(3rem, 10vw, 6rem); margin:6px 0 0; letter-spacing:-.03em; line-height:1; }
  .hero h2 { font-size:clamp(1.4rem, 4vw, 2.2rem); font-weight:500; color:var(--muted); margin:10px 0 18px; }
  h2.title { font-size:clamp(1.8rem, 5vw, 3rem); letter-spacing:-.02em; margin:0 0 40px; line-height:1.1; }
  .sub { max-width:620px; margin:0 auto 28px; color:var(--muted); font-size:1.15rem; }
  .cta { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .badge { display:inline-block; margin-top:22px; border:1px solid var(--gold); color:var(--gold); padding:4px 14px; border-radius:20px; font-size:.85rem; }
  .eye { width:260px; max-width:60%; margin:36px auto 0; display:block; }
  .glow { animation:pulse 3s ease-in-out infinite; transform-origin:256px 215px; }
  @keyframes pulse { 0%,100% { transform:scale(1); opacity:.9; } 50% { transform:scale(1.04); opacity:1; } }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px 22px; text-align:left; }
  .card h3 { margin:0 0 8px; font-size:1.2rem; }
  .card p { margin:0; color:var(--muted); }
  .specs { background:var(--bg2); max-width:none; }
  .specs .grid { max-width:1000px; margin:0 auto; }
  .num { font-size:3.2rem; font-weight:700; letter-spacing:-.03em; }
  .lbl { color:var(--muted); }
  table { width:100%; max-width:760px; margin:0 auto; border-collapse:collapse; }
  th, td { padding:14px 10px; border-bottom:1px solid var(--line); text-align:center; }
  th:first-child, td:first-child { text-align:left; color:var(--muted); }
  th { font-size:1.05rem; }
  td.win { color:var(--gold); font-weight:600; }
  .scroll { overflow-x:auto; }
  .quote { font-size:1.15rem; }
  .stars { color:#ffb300; letter-spacing:3px; font-size:1.1rem; margin-bottom:10px; }
  .who { color:var(--muted); margin-top:16px; font-size:.9rem; display:flex; align-items:center; gap:10px; }
  .av { width:38px; height:38px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:var(--line); font-size:1.15rem; flex:none; }
  .av.chad { background:radial-gradient(circle at 50% 50%, #fff3a0 0, #ffb300 14%, #e53012 42%, #4a0905 100%); border:3px solid #7a808c; }
  .fine { color:var(--muted); font-size:.85rem; margin-top:20px; }
  .price { background:var(--card); border:1px solid var(--line); border-radius:24px; max-width:420px; margin:0 auto; padding:36px 28px; }
  .price .big { font-size:3rem; font-weight:700; margin:6px 0 14px; }
  .price ul { list-style:none; padding:0; margin:0 0 24px; color:var(--muted); }
  .price li { padding:6px 0; }
  .notice { max-width:560px; margin:22px auto 0; border:1px solid var(--gold); border-radius:14px; padding:14px 16px; color:var(--gold); font-size:.92rem; text-align:left; }
  footer { border-top:1px solid var(--line); padding:36px 24px 60px; text-align:center; color:var(--muted); font-size:.85rem; }
  footer .wrap { max-width:720px; margin:0 auto; }
  footer .strong { color:var(--gold); font-weight:600; margin-bottom:10px; }
  .fade { opacity:0; transform:translateY(24px); transition:opacity .8s ease, transform .8s ease; }
  .fade.in { opacity:1; transform:none; }
  @media (prefers-reduced-motion:reduce) { .fade { opacity:1; transform:none; transition:none; } .glow { animation:none; } }
</style>

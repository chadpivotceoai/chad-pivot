    kofi: "☕ Invita a Chad a un café (él no puede permitírselo)",
    foot: "⚠️ PROYECTO DE PARODIA. No es un producto real. Sin IA real. Nada que vender. Solo para reír.",
    voiceLang: "es-ES",
    phrases: ["¿Para cuándo?", "Metele AI.", "Hagamos un sync para planificar el siguiente sync.", "Esto es un quick win. Tardará 8 meses.", "Circulemos esto offline.", "No hay presupuesto, pero hay mucha pasión.", "Despedí a 200 personas con empatía simulada.", "Pivotemos. Otra vez.", "Somos una familia. Una familia que hace despidos.", "Sinergia. No sé qué significa, pero dilo más fuerte.", "Haz más con menos. Luego haz menos con nada.", "Lo hablamos offline. Para siempre.", "No hay que hervir el océano. Solo cambiarle el nombre.", "Lo necesito para ayer. Y no tenemos datos de ayer.", "Pongamos un pin en esto. Y olvidemos dónde está el pin.", "Nuestra gente es nuestro mayor activo. Los activos se pueden vender.", "Veamos esto a 10.000 metros de altura. Preferiblemente desde un yate.", "Gran idea. Ponla en una diapositiva.", "Según mi último correo. Que no escribí.", "Alineémonos sobre el alineamiento.", "No despedimos a nadie, estamos redimensionando la excelencia.", "Muévete rápido y rompe cosas. Sobre todo el presupuesto.", "El ancho de banda es la nueva moneda. El tuyo es bajo.", "Esta reunión podía ser un correo. Agendemos una reunión para hablarlo.", "Piensa fuera de la caja. Luego mete esa caja en una hoja de cálculo.", "Soy un visionario. No veo los números, pero veo la visión.", "Aprovechemos nuestros aprendizajes para aprender sobre nuestro apalancamiento.", "En “equipo” no hay “yo”. Pero sí hay “IA”.", "La cultura del esfuerzo es hacer horas extra gratis, pero con podcast.", "Hay que ser ágiles. Siéntate 90 minutos en un stand-up.", "No tengo tiempo de leerlo. ¿Me lo resumes en un emoji?", "Nuestra startup es un unicornio. Solo falta encontrar el cuerno.", "Rompamos todo. Empezando por tu hora de comer.", "El fracaso no es una opción. Es una oportunidad de aprendizaje con recorte de presupuesto.", "Estoy abierto al feedback. Mándalo a mi carpeta de spam.", "Hagamos doble clic en eso. Y luego cerremos la ventana.", "Buen trabajo, equipo. Los bonus llegarán. En espíritu.", "Monetizemos las vibras.", "Piénsalo como un quick win con sufrimiento a largo plazo.", "Pagamos en visibilidad. La visibilidad es nuestra moneda estrella."]
  }
};
let lang = "en", last = -1;
const $ = id => document.getElementById(id);


function toggleTheme() {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  if (dark) document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", "dark");
  try { localStorage.setItem("chad-theme", dark ? "light" : "dark"); } catch (e) {}
}

function voicesForLang() {
  if (!("speechSynthesis" in window)) return [];
  return speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith(lang));
}
function currentVoice() {
  const name = $("voiceSel").value;
  return speechSynthesis.getVoices().find(v => v.name === name) || null;
}
function saveVoice() {
  try { localStorage.setItem("chad-voice-" + lang, $("voiceSel").value); } catch (e) {}
}
function fillVoices() {
  const sel = $("voiceSel");
  const list = voicesForLang();
  sel.innerHTML = "";
  list.forEach(v => {
    const o = document.createElement("option");
    o.value = v.name;
    o.textContent = v.name;
    sel.appendChild(o);
  });
  try {
    const saved = localStorage.getItem("chad-voice-" + lang);
    if (saved && list.some(v => v.name === saved)) sel.value = saved;
  } catch (e) {}
  $("voice-pick").style.display = list.length > 0 ? "" : "none";
}
if ("speechSynthesis" in window) { speechSynthesis.onvoiceschanged = fillVoices; }
function setLang(l) {
  lang = l;
  $("btn-en").classList.toggle("on", l === "en");
  $("btn-es").classList.toggle("on", l === "es");
  document.documentElement.lang = l;
  $("tagline").textContent = T[l].tagline;
  $("ask").textContent = T[l].ask;
  $("voice-label").textContent = T[l].voice;
  $("voice-sel-label").textContent = T[l].voiceLabel;
  $("kofi").textContent = T[l].kofi;
  $("foot").textContent = T[l].foot;
  fillVoices();
}

function ask() {
  const list = T[lang].phrases;
  let i;
  do { i = Math.floor(Math.random() * list.length); } while (i === last && list.length > 1);
  last = i;
  const text = list[i];
  $("bubble").textContent = "“" + text + "”";
  speak(text);
}

function speak(text) {
  if (!$("voice").checked || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = T[lang].voiceLang;
  const v = currentVoice();
  if (v) u.voice = v;
  u.pitch = 0.6;
  u.rate = 0.95;
  u.onstart = () => $("app").classList.add("talking");
  u.onend = u.onerror = () => $("app").classList.remove("talking");
  speechSynthesis.speak(u);
}
fillVoices();
</script>
